onboarding = false
[keys]
prefix = "ctrl+space"
last_pane = "prefix+shift+s"
new_tab = ["prefix+c", "prefix+t"]
navigate_workspace_up = "shift+k"
navigate_workspace_down = "shift+j"

[theme]
name = "tokyo-night"
auto_switch = false

[ui]
show_agent_labels_on_pane_borders = true

agent_panel_sort = "spaces"
[experimental]
pane_history = false
kitty_graphics = true

# vim-herdr-navigation
[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "vim-herdr-navigation.left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "vim-herdr-navigation.down"
description = "navigate down (vim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "vim-herdr-navigation.up"
description = "navigate up (vim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "vim-herdr-navigation.right"
description = "navigate right (vim/herdr)"
